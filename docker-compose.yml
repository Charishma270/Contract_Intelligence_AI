services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract-ai-backend

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    container_name: contract-ai-redis

    ports:
      - "6379:6379"

    restart: unless-stopped
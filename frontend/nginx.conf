# ==============================================================================
# Nginx Configuration — Contract Intelligence AI Frontend
# ==============================================================================
# Day 23: Serves the React SPA and reverse-proxies API requests to the
# FastAPI backend container. Eliminates CORS by serving everything from
# a single origin.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------
    # Gzip compression for text-based assets
    # -------------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # -------------------------------------------------------------------
    # Reverse proxy — API requests → FastAPI backend
    # -------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long-running analysis requests
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;
    }

    # Health endpoint proxy
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Docs proxy (Swagger UI)
    location /docs {
        proxy_pass         http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass         http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # -------------------------------------------------------------------
    # Static assets — cache aggressively (Vite hashes filenames)
    # -------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------
    # SPA fallback — serve index.html for all unmatched routes
    # (required for client-side routing with react-router)
    # -------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
